<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Small-size cut of cold-wallet.svg for browser tabs (16–48px): the shield fills ~80% of the
       frame instead of ~44%, the snowflake keeps one pair of branches with heavier strokes, and
       the glow / highlight / outline are dropped because they turn to noise below 32px. -->
  <defs>
    <linearGradient id="fBg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10211b"/>
      <stop offset="1" stop-color="#060a09"/>
    </linearGradient>
    <linearGradient id="fShield" x1="150" y1="116" x2="372" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#52e7b2"/>
      <stop offset="0.52" stop-color="#34d39a"/>
      <stop offset="1" stop-color="#1d9d6c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#fBg)"/>
  <g transform="translate(-19.2 -19.2) scale(0.2)">
    <path d="M256 116 L368 172 V256 C368 326 319 375.5 256 396 C193 375.5 144 326 144 256 V172 Z" fill="url(#fShield)"/>
    <g transform="translate(256 248)" stroke="#08130d" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <g id="spoke">
        <path d="M0 0 V-90" stroke-width="28"/>
        <path d="M0 -52 L26 -78 M0 -52 L-26 -78" stroke-width="20"/>
      </g>
      <use href="#spoke" transform="rotate(60)"/>
      <use href="#spoke" transform="rotate(120)"/>
      <use href="#spoke" transform="rotate(180)"/>
      <use href="#spoke" transform="rotate(240)"/>
      <use href="#spoke" transform="rotate(300)"/>
    </g>
  </g>
</svg>
