<!DOCTYPE html>
<html class="border-themed-color" lang="en" xml:lang="en-US" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
    <title>Cold Wallet</title>
    <meta content="Cold Wallet" name="name">
    <meta content="Cold Wallet - secure and anonymous personal finances dashboard with charts"
          name="Description">
    <meta content="Free Cold Wallet secure with history online free easy anonymous financial dashboard Personal Assets Fiat Crypto Currency cryptocurrency blockchain statistics charts BTC USDT bitcoin"
          name="Keywords">

    <meta content="en" http-equiv="Content-Language">
    <meta content="width=device-width, user-scalable=no" name="viewport">

    <link href="/favicon.ico" rel="icon"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <meta content="#000000" name="theme-color"/>
    <link href="/logo192.svg" rel="apple-touch-icon"/>
    <link href="/manifest.json" rel="manifest"/>
    <!-- Paint the dark theme on the very first frame, before the JS bundle / design.css load,
         so there's no white flash. design.css later sets the same body background/colour via
         --bg / --bg-grad / --ink, so the handoff is seamless. NOTE: these literals duplicate
         those tokens — if the theme background changes in src/design.css, update them here too. -->
    <style>
        :root { color-scheme: dark; }
        html, body { margin: 0; height: 100%; }
        body {
            background: #080c0b;
            background-image: radial-gradient(120% 90% at 78% -10%, #102019 0%, #080c0b 55%);
            color: #eef3f1;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
          rel="stylesheet"/>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div class="root" id="root"></div>
<script type="module" src="/src/index.tsx"></script>
</body>
</html>
